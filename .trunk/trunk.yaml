# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.29.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: typescript
      files: [typescript]
      description: Type-check TypeScript sources using the project compiler
      commands:
        - name: typecheck
          run: node node_modules/typescript/bin/tsc --noEmit --pretty false
          run_from: ${root_or_parent_with(package.json)}
          output: regex
          parse_regex: '(?P<path>.*\.tsx?)\((?P<line>\d+),(?P<col>\d+)\): (?P<severity>error|warning) (?P<code>TS\d+): (?P<message>.*)'
          success_codes: [0, 2]
          batch: true
  enabled:
    - eslint@10.14.0
    - typescript
    - yamllint@1.38.0
    - pinact@5.0.2
    - oxipng@10.2.1
    - actionlint@1.7.12
    - svgo@4.1.0
    - checkov@3.4.3
    - git-diff-check
    - grype@0.121.1
    - markdownlint@0.50.0
    - osv-scanner@2.7.0
    - prettier@3.9.10
    - trufflehog@3.99.8
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
